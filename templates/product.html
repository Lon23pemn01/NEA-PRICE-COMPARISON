<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StockX Product Search</h1>
        <p>Search for products on StockX</p>
        <form method="POST" action="/search">
            <input 
                type="text" 
                name="query" 
                placeholder="Enter product name (e.g., Air Jordan Retro)" 
                required
                style="
                    padding: 0.75rem;
                    font-size: 1rem;
                    border: 2px solid #667eea;
                    border-radius: 5px;
                    width: 80%;
                    max-width: 400px;
                    margin-bottom: 1rem;
                    box-sizing: border-box;
                "
            >
            <br>
            <button 
                type="submit"
                style="
                    padding: 0.75rem 2rem;
                    font-size: 1rem;
                    background-color: #667eea;
                    color: white;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                    transition: background-color 0.3s;
                "
                onmouseover="this.style.backgroundColor='#764ba2'"
                onmouseout="this.style.backgroundColor='#667eea'"
            >
                Search
            </button>
        </form>
    </div>
</body>
</html>
